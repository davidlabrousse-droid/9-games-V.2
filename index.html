<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>9 Games That Made Us</title><style>
:root{--bg:#090b10;--panel:#111620;--line:#293142;--text:#f6f8fb;--muted:#8d97aa;--accent:#a5ff5c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#192431 0,transparent 36%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}main{width:min(1060px,calc(100% - 28px));margin:auto;padding:38px 0 60px}header{text-align:center}.eyebrow{font-size:11px;letter-spacing:.2em;font-weight:900;color:var(--accent)}h1{font-size:clamp(40px,7vw,70px);line-height:.9;letter-spacing:-.055em;margin:9px 0 13px}.sub{color:var(--muted);font-size:13px}.tabs{display:flex;max-width:610px;margin:26px auto 18px;padding:5px;border:1px solid var(--line);background:#ffffff06;border-radius:15px;gap:5px}.tab{flex:1;border:0;background:none;color:var(--muted);padding:11px;border-radius:11px;font-weight:850;cursor:pointer}.tab.on{background:#f5f7fa;color:#090b10}.searchWrap{max-width:760px;margin:0 auto 28px;position:relative}.search{height:58px;display:flex;align-items:center;gap:11px;padding:0 17px;border:1px solid var(--line);border-radius:15px;background:var(--panel)}.search:focus-within{border-color:#a5ff5c80;box-shadow:0 0 0 4px #a5ff5c0d}.searchIcon{font-size:22px;color:#687287}.search input{width:100%;border:0;outline:0;background:none;color:white;font-size:16px}.results{position:absolute;z-index:50;top:65px;left:0;right:0;max-height:480px;overflow:auto;background:#111620fc;border:1px solid #30394a;border-radius:15px;box-shadow:0 22px 55px #000c}.result{width:100%;display:flex;gap:13px;align-items:center;border:0;border-bottom:1px solid #252d3b;background:none;color:white;padding:10px 13px;text-align:left;cursor:pointer}.result:hover{background:#ffffff09}.thumb,.ph{width:50px;height:67px;object-fit:contain;background:#090c12;border-radius:6px;flex:none}.rt{font-weight:850}.meta{font-size:11px;color:var(--accent);margin-top:4px}.desc{font-size:11px;color:var(--muted);margin-top:3px}.msg{padding:17px;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,245px));justify-content:center;gap:14px}.slot{aspect-ratio:3/4;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#151b27,#0e121a);position:relative;overflow:hidden;display:grid;place-items:center;cursor:pointer}.slot.empty:hover{border-color:#68758a;transform:translateY(-2px)}.slot img{width:100%;height:100%;object-fit:contain;padding:7px}.rank{position:absolute;z-index:4;top:10px;left:10px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#080b10e8;border:1px solid #ffffff28;font-weight:900}.remove{position:absolute;z-index:8;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:1px solid #ffffff35;background:#080b10e8;color:#fff;font-size:20px;line-height:1;cursor:pointer}.plus{font-size:38px;color:#566176;text-align:center}.plus small{display:block;font-size:9px;letter-spacing:.08em;margin-top:7px}.caption{position:absolute;z-index:3;left:9px;right:9px;bottom:9px;padding:9px 10px;border-radius:10px;background:#080b10e8;font-size:12px;font-weight:900}.caption small{display:block;color:var(--accent);margin-top:4px;font-size:10px}.foot{text-align:center;color:#616b7e;font-size:10px;margin-top:25px}@media(max-width:620px){main{padding-top:25px}.grid{gap:7px}.slot{border-radius:11px}.rank,.remove{width:28px;height:28px;font-size:12px}.remove{font-size:17px}.caption{font-size:10px}}
</style></head><body><main><header><div class="eyebrow">THE GAMES THAT SHAPED US</div><h1>9 GAMES THAT<br>MADE US.</h1><div class="sub">Neuf jeux. Neuf souvenirs. Les versions originales sont privilégiées.</div></header><div id="tabs" class="tabs"></div><div class="searchWrap"><div class="search"><span class="searchIcon">⌕</span><input id="q" autocomplete="off" placeholder="Rechercher un jeu vidéo…"></div><div id="results" class="results" hidden></div></div><section id="grid" class="grid"></section><div class="foot">Catalogue rétro local + base de jeux vidéo Wikidata · aucun film ni série</div></main><script>
const tabs=document.querySelector('#tabs'),grid=document.querySelector('#grid'),q=document.querySelector('#q'),results=document.querySelector('#results');const people=['David','Melchior','Ken'];let active='David',timer,RETRO=[],CURATED=[];let data=JSON.parse(localStorage.getItem('nineGamesFinal')||'null')||Object.fromEntries(people.map(p=>[p,Array(9).fill(null)]));const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\b(viii)\b/g,'8').replace(/\b(vii)\b/g,'7').replace(/\b(vi)\b/g,'6').replace(/\b(iv)\b/g,'4').replace(/\b(iii)\b/g,'3').replace(/\b(ii)\b/g,'2').replace(/[^a-z0-9]+/g,' ').trim();const aliases=n=>n.split('~').map(x=>x.replace(/\s*\([^)]*\)/g,'').trim()).filter(Boolean);function save(){localStorage.setItem('nineGamesFinal',JSON.stringify(data))}function render(){tabs.innerHTML=people.map(p=>`<button class="tab ${p===active?'on':''}" data-p="${p}">${p}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.p;render()});grid.innerHTML=data[active].map((g,i)=>`<article class="slot ${g?'':'empty'}" data-i="${i}">${g?.cover?`<img src="${esc(g.cover)}" alt="">`:''}<div class="rank">${i+1}</div>${g?`<button class="remove" data-r="${i}" aria-label="Retirer">×</button><div class="caption">${esc(g.title)}<small>${esc([g.year,g.platform].filter(Boolean).join(' · '))}</small></div>`:`<div class="plus">+<small>AJOUTER UN JEU</small></div>`}</article>`).join('');grid.querySelectorAll('.remove').forEach(b=>b.onclick=e=>{e.stopPropagation();data[active][+b.dataset.r]=null;save();render()});grid.querySelectorAll('.empty').forEach(s=>s.onclick=()=>{q.focus();q.scrollIntoView({behavior:'smooth',block:'center'})})}Promise.all([fetch('./retro-index.json').then(r=>r.json()),fetch('./games.json').then(r=>r.json())]).then(async([r,c])=>{RETRO=r;CURATED=c;let changed=false;for(const p of people)for(let i=0;i<9;i++){let g=data[p][i];if(g&&!g.cover){let found=(await searchGames(g.title)).find(x=>norm(x.title)===norm(g.title)&&x.cover);if(found){data[p][i]={...g,...found};changed=true}}}if(changed){save();render()}});
function localSearch(term){let nq=norm(term),out=[];for(const g of CURATED){let names=[g.title,...(g.aliases||[])];let best=Math.max(...names.map(n=>{let x=norm(n);return x===nq?100:x.startsWith(nq)?80:x.includes(nq)?60:0}));if(best)out.push({...g,score:best,source:'catalog'})}for(const x of RETRO){let names=aliases(x.n),best=Math.max(0,...names.map(n=>{let z=norm(n);return z===nq?96:z.startsWith(nq)?72:z.includes(nq)?50:0}));if(best)out.push({id:x.p+'-'+x.n,title:(names.find(n=>norm(n)===nq)||names[names.length-1]||x.n),year:'',platform:x.p,cover:x.u,score:best,source:'retro'})}let seen=new Set;return out.sort((a,b)=>b.score-a.score).filter(x=>{let k=norm(x.title)+'|'+x.platform;if(seen.has(k))return false;seen.add(k);return true}).slice(0,7)}
async function wdSearch(term){let u='https://www.wikidata.org/w/api.php?origin=*&action=wbsearchentities&format=json&language=en&limit=12&type=item&search='+encodeURIComponent(term),s=(await fetch(u).then(r=>r.json())).search||[],ids=s.map(x=>x.id);if(!ids.length)return[];let eu='https://www.wikidata.org/w/api.php?origin=*&action=wbgetentities&format=json&languages=en&props=claims|labels|descriptions|sitelinks&ids='+ids.join('|'),es=(await fetch(eu).then(r=>r.json())).entities||{},valid=[];for(const hit of s){let e=es[hit.id],types=(e?.claims?.P31||[]).map(x=>x.mainsnak?.datavalue?.value?.id);if(!types.includes('Q7889'))continue;let dates=(e.claims?.P577||[]).map(x=>x.mainsnak?.datavalue?.value?.time).filter(Boolean).sort(),year=dates[0]?.match(/[+-](\d{4})/)?.[1]||'',pids=(e.claims?.P400||[]).map(x=>x.mainsnak?.datavalue?.value?.id).filter(Boolean),platform='';if(pids.length){let pu='https://www.wikidata.org/w/api.php?origin=*&action=wbgetentities&format=json&languages=en&props=labels&ids='+pids.join('|'),pe=(await fetch(pu).then(r=>r.json())).entities||{};platform=pids.map(id=>pe[id]?.labels?.en?.value).filter(Boolean)[0]||''}let image=(e.claims?.P18||[])[0]?.mainsnak?.datavalue?.value||'',cover=image?'https://commons.wikimedia.org/wiki/Special:Redirect/file/'+encodeURIComponent(image):'';if(!cover&&e.sitelinks?.enwiki?.title){let wu='https://en.wikipedia.org/w/api.php?origin=*&action=query&format=json&prop=pageimages&piprop=thumbnail&pithumbsize=500&titles='+encodeURIComponent(e.sitelinks.enwiki.title),wj=await fetch(wu).then(r=>r.json()),wp=Object.values(wj.query?.pages||{})[0];cover=wp?.thumbnail?.source||''}valid.push({id:hit.id,title:e.labels?.en?.value||hit.label,year,platform,cover,desc:e.descriptions?.en?.value||'video game',score:40,source:'wikidata'})}return valid.slice(0,5)}
async function searchGames(term){let local=localSearch(term),remote=await wdSearch(term).catch(()=>[]),by=new Map;for(const x of [...local,...remote]){let k=norm(x.title),old=by.get(k);if(!old)by.set(k,x);else by.set(k,{...x,...old,cover:old.cover||x.cover,year:old.year||x.year,platform:old.platform||x.platform,desc:old.desc||x.desc})}return [...by.values()].sort((a,b)=>(b.score||0)-(a.score||0)).slice(0,8)}
function show(items){results.innerHTML=items.length?items.map((g,i)=>`<button class="result" data-i="${i}">${g.cover?`<img class="thumb" src="${esc(g.cover)}" onerror="this.outerHTML='<span class=&quot;ph&quot;></span>'">`:'<span class="ph"></span>'}<span><div class="rt">${esc(g.title)}</div><div class="meta">${esc([g.year,g.platform].filter(Boolean).join(' · ')||'Jeu vidéo')}</div><div class="desc">${g.source==='retro'?'Version originale / rétro':esc(g.desc||'Jeu vidéo')}</div></span></button>`).join(''):'<div class="msg">Aucun jeu vidéo correspondant.</div>';results.hidden=false;results.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>add(items[+b.dataset.i]))}
function add(g){let i=data[active].findIndex(x=>!x);if(i<0)return alert('Les 9 emplacements sont déjà remplis.');data[active][i]=g;save();render();q.value='';results.hidden=true}q.oninput=()=>{clearTimeout(timer);let s=q.value.trim();if(s.length<2){results.hidden=true;return}timer=setTimeout(async()=>{results.hidden=false;results.innerHTML='<div class="msg">Recherche…</div>';show(await searchGames(s))},220)};document.addEventListener('click',e=>{if(!e.target.closest('.searchWrap'))results.hidden=true});render();
</script></body></html>
